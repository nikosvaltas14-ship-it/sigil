# Secret scan + tests on every push and pull request.
#
# Safe for a public repo: `pull_request` (never `pull_request_target`), so a
# fork's code runs with a read-only token and no repository secrets; this
# workflow uses no secrets of its own. Actions are pinned to commit SHAs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # scan the full history, not just the tip
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the read-only workflow token
          GITLEAKS_ENABLE_COMMENTS: false

  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (hash-checked)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Tests (offline; the xelatex ones skip without TeX)
        run: python -m pytest -q
